services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    dns:
      - 195.179.224.53
      - 209.126.15.53
      - 8.8.8.8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heliumdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backup.sql:/docker-entrypoint-initdb.d/01_backup.sql
    # No host port exposed — internal Docker network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    dns:
      - 195.179.224.53
      - 209.126.15.53
      - 8.8.8.8
    environment:
      # Set DATABASE_URL in a local .env file (git-ignored). Falls back to the
      # bundled local Postgres service if unset.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres/${POSTGRES_DB:-heliumdb}?sslmode=disable}
      PORT: "8080"
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:1000,http://169.58.108.61:1001,https://tahir.servecounterstrike.com}
    # No host port exposed — internal Docker network only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    dns:
      - 195.179.224.53
      - 209.126.15.53
      - 8.8.8.8
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
