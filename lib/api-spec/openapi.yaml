      tags: [masters]
      summary: Create machine operator master entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMachineOperatorBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineOperatorLookupItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /masters/machine-operator/{id}:
    put:
      operationId: updateMachineOperatorMaster
      tags: [masters]
      summary: Update machine operator master entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMachineOperatorBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineOperatorLookupItem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteMachineOperatorMaster
      tags: [masters]
      summary: Delete machine operator master entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── TRANSACTION ENDPOINTS ────────────────────────────────────────────────

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionSummary"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionWithDetails"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a single transaction with details
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Transaction with line items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionWithDetails"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionWithDetails"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /salary-entries:
    get:
      operationId: listSalaryEntries
      tags: [payroll]
      summary: List salary entry headers
      parameters:
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: departmentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of salary headers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryHeader"
    post:
      operationId: createSalaryEntry
      tags: [payroll]
      summary: Create a new salary entry header with detail rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalaryEntryBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryHeader"
        "409":
          description: Duplicate operator in same month/year

  /salary-entries/{id}:
    get:
      operationId: getSalaryEntry
      tags: [payroll]
      summary: Get a salary entry header with its detail rows
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Salary entry with details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryHeaderWithDetails"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSalaryEntry
      tags: [payroll]
      summary: Update a salary entry (blocked if posted)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalaryEntryBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryHeader"
        "403":
          description: Record is posted and cannot be edited
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSalaryEntry
      tags: [payroll]
      summary: Delete a salary entry (blocked if posted)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "403":
          description: Record is posted and cannot be deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /salary-entries/{id}/post:
    post:
      operationId: postSalaryEntry
      tags: [payroll]
      summary: Post (lock) a salary entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryHeader"
        "404":
          $ref: "#/components/responses/NotFound"

  /salary-entries/{id}/unpost:
    post:
      operationId: unpostSalaryEntry
      tags: [payroll]
      summary: Un-post (unlock) a salary entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Un-posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryHeader"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundResponse"
    Conflict:
      description: Conflict (duplicate)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LookupItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
      required:
        - id
        - name
        - code

    MachineLookupItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        machineNumber:
          type: string
      required:
        - id
        - name
        - machineNumber

    YarnCountLookupItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        count:
          type: string
      required:
        - id
        - name
        - count

    UomLookupItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        abbreviation:
          type: string
      required:
        - id
        - name
        - abbreviation

    MachineOperatorLookupItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        departmentId:
          type: integer
          nullable: true
        baseSalary:
          type: string
          nullable: true
        overtimeRateHr:
          type: string
          nullable: true
        attAllowance:
          type: string
          nullable: true
        othAllowance:
          type: string
          nullable: true
        active:
          type: boolean
          default: true
      required:
        - id
        - name
        - code
        - active

    CreateMachineOperatorBody:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        departmentId:
          type: integer
          nullable: true
        baseSalary:
          type: string
          nullable: true
        overtimeRateHr:
          type: string
          nullable: true
        attAllowance:
          type: string
          nullable: true
        othAllowance:
          type: string
          nullable: true
        active:
          type: boolean
          default: true
      required:
        - name
        - code

    JobLookupItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        partyId:
          type: integer
          nullable: true
        partyName:
          type: string
          nullable: true
      required:
        - id
        - name
        - code

    CreateJobBody:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        partyId:
          type: integer
          nullable: true
      required:
        - name
        - code

    CreateLookupBody:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
      required:
        - name
        - code

    CreateMachineBody:
      type: object
      properties:
        name:
          type: string
        machineNumber:
          type: string
      required:
        - name
        - machineNumber

    CreateYarnCountBody:
      type: object
      properties:
        name:
          type: string
        count:
          type: string
      required:
        - name
        - count

    CreateUomBody:
      type: object
      properties:
        name:
          type: string
        abbreviation:
          type: string
      required:
        - name
        - abbreviation

    BadRequestResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    NotFoundResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ConflictResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    TransactionDetailItem:
      type: object
      properties:
        id:
          type: integer
        headerId:
          type: integer
        machineId:
          type: integer
          nullable: true
        machineOperatorId:
          type: integer
          nullable: true
        yarnTypeId:
          type: integer
          nullable: true
        yarnCountId:
          type: integer
          nullable: true
        yarnBrandId:
          type: integer
          nullable: true
        uomId:
          type: integer
          nullable: true
        quantity:
          type: string
          nullable: true
        netWt:
          type: string
          nullable: true
      required:
        - id
        - headerId

    TransactionSummary:
      type: object
      properties:
        id:
          type: integer
        transactionTypeId:
          type: integer
        date:
          type: string
        docNumber:
          type: string
        jobId:
          type: integer
          nullable: true
        partyId:
          type: integer
          nullable: true
        locationId:
          type: integer
          nullable: true
        fabricTypeId:
          type: integer
          nullable: true
        sl:
          type: string
          nullable: true
        gsm:
          type: integer
          nullable: true
        reference:
          type: string
          nullable: true
        yarnBrandIds:
          type: array
          items:
            type: integer
      required:
        - id
        - transactionTypeId
        - date
        - docNumber

    TransactionWithDetails:
      type: object
      properties:
        id:
          type: integer
        transactionTypeId:
          type: integer
        date:
          type: string
        docNumber:
          type: string
        jobId:
          type: integer
          nullable: true
        partyId:
          type: integer
          nullable: true
        locationId:
          type: integer
          nullable: true
        fabricTypeId:
          type: integer
          nullable: true
        sl:
          type: string
          nullable: true
        gsm:
          type: integer
          nullable: true
        reference:
          type: string
          nullable: true
        details:
          type: array
          items:
            $ref: "#/components/schemas/TransactionDetailItem"
      required:
        - id
        - transactionTypeId
        - date
        - docNumber
        - details

    CreateTransactionDetailBody:
      type: object
      properties:
        machineId:
          type: integer
          nullable: true
        machineOperatorId:
          type: integer
          nullable: true
        yarnTypeId:
          type: integer
          nullable: true
        yarnCountId:
          type: integer
          nullable: true
        yarnBrandId:
          type: integer
          nullable: true
        uomId:
          type: integer
          nullable: true
        quantity:
          type: string
          nullable: true
        netWt:
          type: string
          nullable: true

    CreateTransactionBody:
      type: object
      properties:
        transactionTypeId:
          type: integer
        date:
          type: string
        docNumber:
          type: string
        jobId:
          type: integer
          nullable: true
        partyId:
          type: integer
          nullable: true
        locationId:
          type: integer
          nullable: true
        fabricTypeId:
          type: integer
          nullable: true
        sl:
          type: string
          nullable: true
        gsm:
          type: integer
          nullable: true
        reference:
          type: string
          nullable: true
        details:
          type: array
          items:
            $ref: "#/components/schemas/CreateTransactionDetailBody"
      required:
        - transactionTypeId
        - date
        - docNumber
        - details

    SalaryHeader:
      type: object
      properties:
        id:
          type: integer
        month:
          type: integer
        year:
          type: integer
        departmentIds:
          type: array
          items:
            type: integer
        departmentNames:
          type: array
          items:
            type: string
        posted:
          type: boolean
        createdAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
      required: [id, month, year, departmentIds, departmentNames, posted]

    SalaryDetailRow:
      type: object
      properties:
        id:
          type: integer
        headerId:
          type: integer
        operatorId:
          type: integer
        operatorName:
          type: string
        basicSalary:
          type: string
        otRateHr:
          type: string
        attAllowance:
          type: string
        othAllowance:
          type: string
        presentDays:
          type: string
        absentDays:
          type: string
        holidays:
          type: string
        totalAttendance:
          type: string
        totalSalary:
          type: string
        otHours:
          type: string
        otAmount:
          type: string
        advanceDeduction:
          type: string
        loanDeduction:
          type: string
        otherDeduction:
          type: string
        payableSalary:
          type: string
      required: [id, headerId, operatorId, operatorName]

    SalaryHeaderWithDetails:
      allOf:
        - $ref: "#/components/schemas/SalaryHeader"
        - type: object
          properties:
            details:
              type: array
              items:
                $ref: "#/components/schemas/SalaryDetailRow"
          required: [details]

    SalaryDetailInput:
      type: object
      properties:
        operatorId:
          type: integer
        basicSalary:
          type: number
        otRateHr:
          type: number
        attAllowance:
          type: number
        othAllowance:
          type: number
        presentDays:
          type: number
        absentDays:
          type: number
        holidays:
          type: number
        totalAttendance:
          type: number
        totalSalary:
          type: number
        otHours:
          type: number
        otAmount:
          type: number
        advanceDeduction:
          type: number
        loanDeduction:
          type: number
        otherDeduction:
          type: number
        payableSalary:
          type: number
      required: [operatorId]

    CreateSalaryEntryBody:
      type: object
      properties:
        month:
          type: integer
        year:
          type: integer
        departmentIds:
          type: array
          items:
            type: integer
        details:
          type: array
          items:
            $ref: "#/components/schemas/SalaryDetailInput"
      required: [month, year, departmentIds, details]
