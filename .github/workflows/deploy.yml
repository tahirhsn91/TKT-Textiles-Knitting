name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Gate. Calls the same workflow that runs on PRs, so production can no longer be
  # deployed from a commit that fails to install or compile — and there is only one
  # definition of "CI" to keep current.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          timeout: 30s
          command_timeout: 30m
          script: |
            bash /home/deploy/project/tkt-textiles-prod/app/scripts/deploy.sh
