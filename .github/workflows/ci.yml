name: CI

# Runs on every PR and on pushes to develop. Also exposed as a reusable workflow
# (`workflow_call`) so the production deploy in deploy.yml gates on exactly these checks
# rather than a second copy that can drift.
#
# Scope note: this runs the same commands the images run — a real TypeScript compile and a
# real frontend build — so a change that cannot compile never reaches main. The unit test
# suites are deliberately NOT part of the gate yet: backend/src/__tests__/tenant-isolation.test.ts
# imports the DB layer and needs a live DATABASE_URL, so `npm test` fails today on a clean
# runner. Wiring the tests in (with a Postgres service container) is a follow-up, not a
# reason to freeze deploys.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

jobs:
  backend:
    name: backend — install + build (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: backend
      - name: Build (TypeScript compile)
        run: npm run build
        working-directory: backend

  frontend:
    name: frontend — install + build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
