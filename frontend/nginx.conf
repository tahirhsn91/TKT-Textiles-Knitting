gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow logo/favicon uploads up to the backend's 2MB limit (default is 1MB).
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public health-check endpoint for uptime monitoring (issue #29). Backs onto
    # the backend's /api/healthz, which touches the DB (select 1) and returns
    # 200 {status:ok} or 503 {status:degraded}. Point Uptime Robot / Grafana at
    # https://<host>/health (or /healthz).
    location = /healthz {
        proxy_pass http://backend:8080/api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
    location = /health {
        proxy_pass http://backend:8080/api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # Vite emits content-hashed filenames under /assets/, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
