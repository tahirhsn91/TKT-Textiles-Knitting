kind = "web"
previewPath = "/"
title = "Fabric Factory Management"
version = "1.0.0"
id = "artifacts/factory-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26010

[services.development]
run = "pnpm --filter @workspace/factory-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/factory-ui", "run", "build" ]
publicDir = "artifacts/factory-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26010"
BASE_PATH = "/"
